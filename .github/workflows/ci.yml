name: Verify Vedra
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -r requirements-hermes.txt
      - run: python -m compileall -q backend hermes scripts
      - run: node scripts/check_frontend.mjs
      - run: node scripts/test_map.mjs
      - run: pytest -q --junitxml=artifacts/tests.xml
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_ui.py --output artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
