name: Verify Vedra
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -r requirements-hermes.txt
      - run: python -m compileall -q backend hermes scripts
      - run: node scripts/check_frontend.mjs
      - run: node scripts/test_map.mjs
      - run: node scripts/test_catalog.mjs
      - run: pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/test_worker_processes.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_ui.py --output artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: vedra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vedra_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@localhost:5432/vedra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements-cloud.txt
      - run: pytest -q backend/tests/test_postgres.py --junitxml=artifacts/postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-verification
          path: artifacts/
