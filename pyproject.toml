[project]
name = "vedra-real-estate"
version = "0.1.0"
description = "Real estate origination workspace with deterministic acquisition and Hermes skills"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4",
  "httpx==0.28.1", "beautifulsoup4==4.14.3", "python-docx==1.2.0", "openpyxl==3.1.5"
]
[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.51,<2"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
where = ["backend"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
