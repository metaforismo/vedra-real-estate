services:
  app:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-0}
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vedra-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    mem_limit: ${VEDRA_MEMORY_LIMIT:-1g}
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
volumes:
  vedra-data:
